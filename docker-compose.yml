version: '3.8'

services:
  thetimethen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thetimethen-dev
    
    # Keep container running for interactive work
    stdin_open: true
    tty: true
    
    # Mount local directories
    volumes:
      # Code (mounted as read-write for development)
      - .:/app
      
      # Shared database directory on OneDrive (persistent across computers)
      # .env example: DB_VOLUME_PATH=D:/Nvisions OneDrive/OneDrive/TheTimeThen-Data/data
      - ${DB_VOLUME_PATH}:/app/data
      
      # Output directories (persistent, also on OneDrive for sync)
      # .env example: OUTPUT_VOLUME_PATH=D:/Nvisions OneDrive/OneDrive/TheTimeThen-Data/output
      - ${OUTPUT_VOLUME_PATH}:/app/output
    
    # Environment variables
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    
    # Expose ports if needed (for future API services)
    ports:
      - "8000:8000"
    
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

# Named volumes for persistent data
volumes:
  database:
    driver: local
  outputs:
    driver: local
